<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CIE pseudocode runner</title>
    <link rel="stylesheet" href="./css/dark.css">
</head>
<body>
    <h1>CIE pseudocode runner</h1>
    <textarea id="code_input" rows="15" style="width: 100%; font-family: monospace; font-size: 14px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
    <button onclick="run()">Run Code</button>

    <h2>Output</h2>
    <div id="output" style="white-space: pre-wrap;"></div>

    <h2>Errors</h2>
    <div id="errors" style="white-space: pre-wrap;"></div>

    <div id="notes">
        <p>Note: use <b><-</b> for text</p>
        <h3>Supported features:</h2>
        <ul>
            <li>Data types:
                <ul>
                    <li>INTEGER</li>
                    <li>STRING</li>
                    <li>BOOLEAN</li>
                </ul>
            </li>
            <li>Operations:
                <ul>
                    <li>+ - * /</li>
                    <li>( )</li>
                    <li>AND, NOT, OR</li>
                </ul>
            </li>
            <li>DECLARE</li>
            <li>INPUT</li>
            <li>OUTPUT</li>
        </ul>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
